name: Sumire Full Preview CI

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumire-preview-${{ github.event_name == 'pull_request' && github.event.number || 'trusted' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Full ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [feature, preview]
    env:
      ZENZ_DEBUG_NATIVE_ABIS: arm64-v8a
      ZENZ_RELEASE_NATIVE_ABIS: arm64-v8a,x86_64
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.target == 'feature' && 'feature/custom-haptics' || github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "ZENZ_MODEL_CACHE_DIR=$RUNNER_TEMP/zenz-model-cache" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Assign Preview versionCode
        if: matrix.target == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          # Seconds since 2020. Allocated after this serialized workflow starts.
          code=$(( $(date -u +%s) - 1577836800 ))
          test "$code" -gt 100000000
          test "$code" -le 2100000000
          echo "PREVIEW_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Keyboard unit tests
        run: bash ./gradlew :custom_keyboard:test --no-daemon --console=plain --max-workers=2
      - name: Full app regression tests
        run: |
          bash ./gradlew :app:testFullStandardDebugUnitTest \
            --tests '*VibrationTimingPolicyTest' \
            --tests '*CustomHapticSettingsEntryPointTest' \
            --tests '*CustomHapticBackupCompatibilityTest' \
            --tests '*KeyboardLayout*Test' \
            --tests '*KeyboardBackup*Test' \
            --no-daemon --console=plain --max-workers=2
      - name: Build Full Standard Debug
        if: matrix.target == 'feature'
        run: bash ./gradlew :app:assembleFullStandardDebug --no-daemon --console=plain --max-workers=2
      - name: Build unsigned Full Preview
        if: matrix.target == 'preview'
        run: |
          bash ./gradlew :app:assembleFullStandardPreview \
            -PpreviewVersionCode="$PREVIEW_VERSION_CODE" \
            --no-daemon --console=plain --max-workers=2
          python3 scripts/preview/verify_apk.py \
            app/build/outputs/apk/fullStandard/preview/sumire-preview-fullStandard-unsigned.apk \
            --version-code "$PREVIEW_VERSION_CODE" \
            --commit "$(git rev-parse HEAD)" --output-dir preview-artifact
      - name: Upload Full Debug for build inspection
        if: matrix.target == 'feature'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumire-feature-full-debug
          path: app/build/outputs/apk/fullStandard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned Full Preview
        if: matrix.target == 'preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumire-preview-full-unsigned
          path: |
            preview-artifact/sumire-preview-full-unsigned.apk
            preview-artifact/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumire-${{ matrix.target }}-test-reports
          path: |
            custom_keyboard/build/test-results/
            custom_keyboard/build/reports/tests/
            app/build/test-results/testFullStandardDebugUnitTest/
            app/build/reports/tests/testFullStandardDebugUnitTest/
          retention-days: 14

  sign:
    name: Sign trusted Full Preview
    needs: verify
    # Normal push/PR CI never accesses signing secrets.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'kkrix3/JapaneseKeyboard' &&
      github.ref == 'refs/heads/preview' &&
      github.actor == 'kkrix3' &&
      github.triggering_actor == 'kkrix3' &&
      vars.PREVIEW_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview-signing
    permissions:
      contents: read
    steps:
      # Only the artifact produced by verify in THIS workflow run is accepted.
      # No checkout, Gradle, repository scripts or caches run with the key.
      - name: Download this run's verified unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sumire-preview-full-unsigned
          path: unsigned
      - name: Install signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Validate provenance and package
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          root = pathlib.Path("unsigned")
          assert sorted(p.name for p in root.iterdir()) == ["metadata.json", "sumire-preview-full-unsigned.apk"]
          apk = root / "sumire-preview-full-unsigned.apk"
          meta = json.loads((root / "metadata.json").read_text())
          assert meta["commit"] == os.environ["EXPECTED_COMMIT"]
          assert meta["sha256"] == hashlib.sha256(apk.read_bytes()).hexdigest()
          assert meta["applicationId"] == "com.kazumaproject.markdownhelperkeyboard.preview"
          assert 100000000 < meta["versionCode"] <= 2100000000
          aapt = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0/aapt"
          badging = subprocess.check_output([str(aapt), "dump", "badging", str(apk)], text=True)
          assert f"name='{meta['applicationId']}'" in badging.splitlines()[0]
          assert f"versionCode='{meta['versionCode']}'" in badging.splitlines()[0]
          with zipfile.ZipFile(apk) as z:
              assert not any(re.search(r"(?i)(keystore|\.(jks|p12|pfx|pem|key)$|local\.properties$)", n) for n in z.namelist())
          PY
      - name: Sign with user-managed Environment secrets
        id: signing
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          PREVIEW_KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$PREVIEW_KEYSTORE_BASE64" || -z "$PREVIEW_KEYSTORE_PASSWORD" || -z "$PREVIEW_KEY_ALIAS" || -z "$PREVIEW_KEY_PASSWORD" ]]; then
            echo "Signing skipped: configure all four preview-signing Environment secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/preview-signing.XXXXXX")
          trap 'rm -rf -- "$keydir"' EXIT
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$keydir/preview.keystore"
          unset PREVIEW_KEYSTORE_BASE64
          mkdir -p signed
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keydir/preview.keystore" \
            --ks-key-alias "$PREVIEW_KEY_ALIAS" \
            --ks-pass env:PREVIEW_KEYSTORE_PASSWORD \
            --key-pass env:PREVIEW_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out signed/sumire-preview-full-signed.apk \
            unsigned/sumire-preview-full-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            signed/sumire-preview-full-signed.apk
          test "$(find signed -type f | wc -l)" -eq 1
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK only
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumire-preview-full-signed
          path: signed/sumire-preview-full-signed.apk
          if-no-files-found: error
          retention-days: 30
